<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Responsive test viewport</title><style>body{margin:0;background:#888}iframe{display:block;border:0;background:white}nav{height:50px;display:flex;align-items:center;gap:10px;padding:0 10px;font:14px system-ui}button{padding:7px}</style></head><body><nav aria-label="Test viewport"><button data-width="320">320px</button><button data-width="390">390px</button><button data-width="768">768px</button><span id="width">390px</span></nav><iframe title="Application viewport" src="../index.html" width="390" height="844"></iframe><script>const frame=document.querySelector('iframe');for(const button of document.querySelectorAll('[data-width]'))button.onclick=()=>{frame.width=button.dataset.width;document.getElementById('width').textContent=button.dataset.width+'px';};</script></body></html>
